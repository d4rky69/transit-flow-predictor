<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransitFlow - Public Transit Delay Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0284c7', // Electric blue
            secondary: '#38bdf8',
            dark: '#1e293b',
            darker: '#0f172a',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          zIndex: {
            '60': '60',
            '70': '70',
            '80': '80',
            '90': '90',
            '100': '100',
          }
        },
      },
    }
  </script>
  <style>
    /* Ensure the UI stays above the map with proper z-indexing */
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .leaflet-container {
      height: 100%;
      width: 100%;
      z-index: 10;
    }
    .overlay-panel {
      z-index: 50 !important;
    }
    .accessibility-btn {
      z-index: 50 !important;
    }
    .accessibility-modal {
      z-index: 100 !important;
    }
    .leaflet-popup {
      z-index: 20;
    }
    /* Fade in animation for UI elements */
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    /* Pulse animation for delayed vehicles */
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-darker text-gray-100">
  <div id="app"></div>

  <script type="text/babel">
    // Import React hooks
    const { useState, useEffect, useRef, useCallback } = React;
    
    // Simulated Lucide icons as SVG components
    const Icons = {
      Bus: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M8 6v6"></path>
          <path d="M15 6v6"></path>
          <path d="M2 12h19.6"></path>
          <path d="M18 18h3s.5-1.7.5-4v-1.5c0-1.8-1.6-3.2-3.5-3.2"></path>
          <path d="M5.5 9.3c-1.9 0-3.5 1.4-3.5 3.2V14c0 2.3.5 4 .5 4h3"></path>
          <circle cx="7" cy="18" r="2"></circle>
          <path d="M8.8 22H15"></path>
          <circle cx="17" cy="18" r="2"></circle>
        </svg>
      ),
      Train: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="4" y="3" width="16" height="16" rx="2"></rect>
          <path d="M4 11h16"></path>
          <path d="M12 3v8"></path>
          <path d="m8 19-2 3"></path>
          <path d="m18 22-2-3"></path>
          <path d="M8 15h0"></path>
          <path d="M16 15h0"></path>
        </svg>
      ),
      Search: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      ),
      Clock: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      ),
      Wheelchair: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="14" cy="6" r="2"></circle>
          <path d="M22 22H2"></path>
          <path d="M14 13.4V22"></path>
          <path d="M6 13h3.5a2 2 0 0 1 1.8 1.8L13 22"></path>
          <path d="M13.9 17H21"></path>
          <circle cx="8" cy="18" r="4"></circle>
        </svg>
      ),
      Accessibility: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="16" cy="4" r="1"></circle>
          <path d="m18 19 1-7-6 1"></path>
          <path d="m5 8 3-3 5.5 3-2.36 3.5"></path>
          <path d="M4.24 14.5A5 5 0 0 0 6.5 19"></path>
          <path d="M14 21v-4.5"></path>
          <path d="M10 21v-5"></path>
        </svg>
      ),
      Menu: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"></line>
          <line x1="4" x2="20" y1="6" y2="6"></line>
          <line x1="4" x2="20" y1="18" y2="18"></line>
        </svg>
      ),
      Close: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      ),
      ChevronUp: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m18 15-6-6-6 6"></path>
        </svg>
      ),
      ChevronDown: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      ),
      Route: ({ className }) => (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="6" cy="19" r="3"></circle>
          <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path>
          <circle cx="18" cy="5" r="3"></circle>
        </svg>
      )
    };

    // Main App Component
    function App() {
      const [vehicles, setVehicles] = useState([]);
      const [mapInstance, setMapInstance] = useState(null);
      const [markers, setMarkers] = useState({});
      const [startLocation, setStartLocation] = useState('');
      const [destination, setDestination] = useState('');
      const [timeSaving, setTimeSaving] = useState(false);
      const [fuelSaving, setFuelSaving] = useState(false);
      const [searchResults, setSearchResults] = useState([]);
      const [isPanelVisible, setIsPanelVisible] = useState(true);
      const [isAccessibilityModalOpen, setIsAccessibilityModalOpen] = useState(false);
      const [highContrast, setHighContrast] = useState(false);
      const [fontSize, setFontSize] = useState(16);
      const [accessibleOnly, setAccessibleOnly] = useState(false);
      const mapRef = useRef(null);
      
      const cityCenter = [40.7128, -74.006]; // NYC-like coordinates

      // Generate initial vehicle data
      useEffect(() => {
        generateVehicles();
      }, []);
      
      const generateVehicles = () => {
        const routeTypes = [
          { number: "M1", type: "Bus" },
          { number: "M2", type: "Bus" },
          { number: "B41", type: "Bus" },
          { number: "A", type: "Train" },
          { number: "B", type: "Train" },
          { number: "C", type: "Train" },
        ];
        
        const initialVehicles = [];
        
        for (let i = 0; i < 15; i++) {
          const routeType = routeTypes[Math.floor(Math.random() * routeTypes.length)];
          const status = Math.random() > 0.7 ? "Delayed" : Math.random() > 0.5 ? "On Time" : "Early";
          
          initialVehicles.push({
            id: `vehicle-${i}`,
            routeNumber: routeType.number,
            type: routeType.type,
            currentPosition: {
              lat: cityCenter[0] + (Math.random() * 0.1 - 0.05),
              lng: cityCenter[1] + (Math.random() * 0.1 - 0.05)
            },
            status: status,
            delayInMinutes: status === "Delayed" ? Math.floor(Math.random() * 20) + 5 : 
                          status === "Early" ? -Math.floor(Math.random() * 5) : 0,
            isWheelchairAccessible: Math.random() > 0.3
          });
        }
        
        setVehicles(initialVehicles);
      };
      
      // Update vehicle positions every 5 seconds
      useEffect(() => {
        const interval = setInterval(() => {
          setVehicles(prevVehicles => prevVehicles.map(vehicle => {
            // 30% chance of changing status
            const changeStatus = Math.random() > 0.7;
            const newStatus = changeStatus ? 
              (Math.random() > 0.6 ? "Delayed" : Math.random() > 0.5 ? "On Time" : "Early") : 
              vehicle.status;
            
            const newDelayInMinutes = newStatus === "Delayed" ? 
              Math.floor(Math.random() * 20) + 5 : 
              newStatus === "Early" ? 
                -Math.floor(Math.random() * 5) : 0;
            
            // Small movement to simulate real-time position change
            const latChange = (Math.random() * 0.005) - 0.0025;
            const lngChange = (Math.random() * 0.005) - 0.0025;
            
            return {
              ...vehicle,
              status: newStatus,
              delayInMinutes: newDelayInMinutes,
              currentPosition: {
                lat: vehicle.currentPosition.lat + latChange,
                lng: vehicle.currentPosition.lng + lngChange
              }
            };
          }));
        }, 5000);
        
        return () => clearInterval(interval);
      }, []);
      
      // Initialize map when component mounts
      useEffect(() => {
        if (!mapRef.current) return;
        
        const map = L.map(mapRef.current).setView(cityCenter, 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        setMapInstance(map);
        
        // Cleanup on unmount
        return () => {
          if (map) {
            map.remove();
          }
        };
      }, []);
      
      // Update markers when vehicles data changes
      useEffect(() => {
        if (!mapInstance) return;
        
        // Clear previous markers
        Object.values(markers).forEach(marker => marker.remove());
        const newMarkers = {};
        
        // Add new markers
        vehicles.forEach(vehicle => {
          const { id, routeNumber, type, currentPosition, status, delayInMinutes, isWheelchairAccessible } = vehicle;
          
          // Define icon color based on status
          const getIconColor = () => {
            switch(status) {
              case 'Delayed': return '#f97316'; // Orange
              case 'Early': return '#10b981'; // Green
              default: return '#3b82f6'; // Blue for on time
            }
          };
          
          const vehicleIcon = L.divIcon({
            className: `vehicle-marker ${status === 'Delayed' ? 'pulse' : ''}`,
            html: `<div class="flex items-center justify-center w-8 h-8 rounded-full" 
                  style="background-color: ${getIconColor()}; border: 2px solid white; display: flex; align-items: center; justify-content: center;">
                    <span style="color: white; font-weight: bold; font-size: 10px;">${type.charAt(0)}</span>
                  </div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          });
          
          const marker = L.marker([currentPosition.lat, currentPosition.lng], { icon: vehicleIcon })
            .addTo(mapInstance)
            .bindPopup(
              `<div class="p-2">
                <h3 class="font-bold">${type} ${routeNumber}</h3>
                <p class="text-sm">Status: ${status}</p>
                <p class="text-sm">Delay: ${delayInMinutes > 0 ? `+${delayInMinutes} min` : 
                                          delayInMinutes < 0 ? `${delayInMinutes} min (early)` : 
                                          'On time'}</p>
                <p class="text-sm">Wheelchair Accessible: ${isWheelchairAccessible ? 'Yes' : 'No'}</p>
              </div>`
            );
            
          newMarkers[id] = marker;
        });
        
        setMarkers(newMarkers);
      }, [vehicles, mapInstance]);
      
      // Search for routes
      const handleSearch = () => {
        if (!startLocation || !destination) {
          alert('Please enter both start and destination locations');
          return;
        }
        
        // Generate simulated route results
        const routeCount = Math.floor(Math.random() * 3) + 2; // 2-4 routes
        const generatedRoutes = [];
        
        const availableVehicles = vehicles.filter(v => 
          accessibleOnly ? v.isWheelchairAccessible : true
        );
        
        for (let i = 0; i < routeCount; i++) {
          const routeVehicles = [];
          const transferCount = fuelSaving ? Math.floor(Math.random() * 2) : Math.floor(Math.random() * 3);
          
          // Add 1-3 vehicles to create a route with transfers
          for (let j = 0; j <= transferCount; j++) {
            if (availableVehicles.length > 0) {
              const vehicleIndex = Math.floor(Math.random() * availableVehicles.length);
              routeVehicles.push(availableVehicles[vehicleIndex]);
            }
          }
          
          if (routeVehicles.length > 0) {
            // Calculate total delay for this route
            const totalDelay = routeVehicles.reduce((sum, v) => sum + v.delayInMinutes, 0);
            const baseTime = Math.floor(Math.random() * 30) + 20; // 20-50 minutes
            const arrivalTime = baseTime + totalDelay;
            
            generatedRoutes.push({
              id: `route-${i}`,
              vehicles: routeVehicles,
              totalDelay,
              baseTime,
              arrivalTime,
              transferCount: routeVehicles.length - 1,
              isAccessible: routeVehicles.every(v => v.isWheelchairAccessible)
            });
          }
        }
        
        // Sort by arrival time if time saving is selected
        if (timeSaving) {
          generatedRoutes.sort((a, b) => a.arrivalTime - b.arrivalTime);
        }
        // Sort by transfers if fuel saving is selected
        else if (fuelSaving) {
          generatedRoutes.sort((a, b) => a.transferCount - b.transferCount);
        }
        
        // If time saving is selected and primary route is delayed, add alternative route
        if (timeSaving && generatedRoutes.length > 0 && generatedRoutes[0].totalDelay > 10) {
          const alternativeRoute = {
            ...generatedRoutes[0],
            id: 'alternative-route',
            isAlternative: true,
            totalDelay: Math.floor(generatedRoutes[0].totalDelay / 2),
            arrivalTime: generatedRoutes[0].baseTime + Math.floor(generatedRoutes[0].totalDelay / 2),
            timeSaved: Math.ceil(generatedRoutes[0].totalDelay / 2)
          };
          generatedRoutes.splice(1, 0, alternativeRoute);
        }
        
        setSearchResults(generatedRoutes);
      };
      
      // Format time from minutes to HH:MM
      const formatTime = (minutes) => {
        const now = new Date();
        const futureTime = new Date(now.getTime() + minutes * 60000);
        return futureTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };
      
      return (
        <div className={`h-screen w-full relative ${highContrast ? 'bg-black' : 'bg-darker'}`} 
             style={{ fontSize: `${fontSize}px` }}>
          
          {/* Map Container */}
          <div ref={mapRef} className="absolute top-0 left-0 w-full h-full z-10"></div>
          
          {/* Search Panel - Positioned with higher z-index */}
          <div className={`overlay-panel absolute top-0 left-0 h-full md:w-80 w-full transition-transform duration-300 ease-in-out transform
            ${isPanelVisible ? 'translate-x-0' : '-translate-x-full md:translate-x-0 md:w-16'}`}>
            <div className={`h-full ${highContrast ? 'bg-black text-white' : 'bg-dark/90 text-gray-100'} backdrop-blur-md p-4 overflow-y-auto`}>
              
              {/* Panel Header */}
              <div className="flex justify-between items-center mb-6">
                <h1 className={`text-xl font-bold ${isPanelVisible ? 'block' : 'hidden md:block'} 
                  ${highContrast ? 'text-white' : 'text-primary'}`}>
                  TransitFlow
                </h1>
                <button 
                  onClick={() => setIsPanelVisible(!isPanelVisible)}
                  className="p-2 rounded-md hover:bg-gray-700/50 transition-colors"
                >
                  {isPanelVisible ? 
                    <Icons.ChevronUp className="h-5 w-5" /> : 
                    <Icons.ChevronDown className="h-5 w-5" />
                  }
                </button>
              </div>
              
              {/* Search Form - Only visible when panel is expanded */}
              {isPanelVisible && (
                <div className="space-y-4 fade-in">
                  <div className="space-y-2">
                    <label className="block text-sm font-medium">Start Location</label>
                    <input 
                      type="text"
                      value={startLocation}
                      onChange={(e) => setStartLocation(e.target.value)}
                      className={`w-full p-2 rounded bg-gray-800 border ${highContrast ? 'border-white' : 'border-gray-700'} focus:ring-2 focus:ring-primary focus:outline-none`}
                      placeholder="Enter starting point"
                    />
                  </div>
                  
                  <div className="space-y-2">
                    <label className="block text-sm font-medium">Destination</label>
                    <input 
                      type="text"
                      value={destination}
                      onChange={(e) => setDestination(e.target.value)}
                      className={`w-full p-2 rounded bg-gray-800 border ${highContrast ? 'border-white' : 'border-gray-700'} focus:ring-2 focus:ring-primary focus:outline-none`}
                      placeholder="Enter destination"
                    />
                  </div>
                  
                  <div className="flex space-x-4">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={timeSaving}
                        onChange={() => setTimeSaving(!timeSaving)}
                        className="rounded text-primary focus:ring-primary"
                      />
                      <span className="text-sm">Time Saving</span>
                    </label>
                    
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={fuelSaving}
                        onChange={() => setFuelSaving(!fuelSaving)}
                        className="rounded text-primary focus:ring-primary"
                      />
                      <span className="text-sm">Fewer Transfers</span>
                    </label>
                  </div>
                  
                  <button
                    onClick={handleSearch}
                    className={`w-full py-2 px-4 rounded-md flex items-center justify-center space-x-2 transition-colors
                      ${highContrast ? 'bg-white text-black hover:bg-gray-300' : 'bg-primary text-white hover:bg-secondary'}`}
                  >
                    <Icons.Search className="h-5 w-5" />
                    <span>Search Routes</span>
                  </button>
                  
                  {/* Search Results */}
                  <div className="mt-6 space-y-4">
                    {searchResults.length > 0 && <h2 className="font-semibold text-lg">Available Routes</h2>}
                    
                    {searchResults.map(route => (
                      <div 
                        key={route.id}
                        className={`p-3 rounded-lg transition-all duration-200 border ${route.isAlternative ? 'border-yellow-500/50' : ''} 
                          ${highContrast ? 'bg-gray-900 border-white' : `bg-gray-800/70 ${route.isAlternative ? 'bg-yellow-900/20' : ''}`}`}
                      >
                        {route.isAlternative && (
                          <div className={`text-xs font-semibold mb-2 ${highContrast ? 'text-yellow-300' : 'text-yellow-400'}`}>
                            Alternative Route (Saves {route.timeSaved} min)
                          </div>
                        )}
                        
                        <div className="flex justify-between items-start mb-2">
                          <div className="flex items-center space-x-2">
                            {route.vehicles.map((vehicle, idx) => (
                              <div 
                                key={`${route.id}-vehicle-${idx}`}
                                className={`rounded-md px-2 py-1 text-xs font-medium flex items-center 
                                  ${highContrast ? 'bg-white text-black' : vehicle.type === 'Bus' ? 'bg-blue-600/70' : 'bg-green-600/70'}`}
                              >
                                {vehicle.type === 'Bus' ? 
                                  <Icons.Bus className="h-3 w-3 mr-1" /> : 
                                  <Icons.Train className="h-3 w-3 mr-1" />
                                }
                                {vehicle.routeNumber}
                                {idx < route.vehicles.length - 1 && <span className="ml-1">→</span>}
                              </div>
                            ))}
                          </div>
                          
                          {route.isAccessible && <Icons.Wheelchair className="h-4 w-4 text-blue-300" />}
                        </div>
                        
                        <div className="flex justify-between items-center text-sm">
                          <div className="flex items-center">
                            <Icons.Clock className="h-4 w-4 mr-1" />
                            <span>Arrives: {formatTime(route.arrivalTime)}</span>
                          </div>
                          
                          <div className={`font-medium ${route.totalDelay > 0 ? 
                            highContrast ? 'text-red-300' : 'text-orange-400' : 
                            route.totalDelay < 0 ? 
                            highContrast ? 'text-green-300' : 'text-green-400' : 
                            'text-gray-300'}`}>
                            {route.totalDelay > 0 ? `+${route.totalDelay} min` : 
                             route.totalDelay < 0 ? `${route.totalDelay} min` : 
                             'On time'}
                          </div>
                        </div>
                        
                        <div className="mt-2 text-xs text-gray-400">
                          Transfers: {route.transferCount}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
          
          {/* Mobile Toggle for Panel - Only visible on mobile */}
          <div className="absolute top-4 right-4 md:hidden z-50">
            <button
              onClick={() => setIsPanelVisible(!isPanelVisible)}
              className={`p-2 rounded-full shadow-lg ${highContrast ? 'bg-white text-black' : 'bg-primary text-white'}`}
            >
              {isPanelVisible ? 
                <Icons.Close className="h-5 w-5" /> : 
                <Icons.Menu className="h-5 w-5" />
              }
            </button>
          </div>
          
          {/* Accessibility Button */}
          <div className="absolute bottom-6 right-6 accessibility-btn">
            <button
              onClick={() => setIsAccessibilityModalOpen(true)}
              className={`p-3 rounded-full shadow-lg transition-colors
                ${highContrast ? 'bg-white text-black hover:bg-gray-300' : 'bg-primary text-white hover:bg-secondary'}`}
              aria-label="Accessibility Options"
            >
              <Icons.Accessibility className="h-6 w-6" />
            </button>
          </div>
          
          {/* Accessibility Modal */}
          {isAccessibilityModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-100 accessibility-modal">
              <div className={`rounded-lg p-6 max-w-md w-full ${highContrast ? 'bg-black text-white border border-white' : 'bg-dark text-gray-100'}`}>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold">Accessibility Options</h2>
                  <button
                    onClick={() => setIsAccessibilityModalOpen(false)}
                    className="p-1 rounded-full hover:bg-gray-700/50"
                  >
                    <Icons.Close className="h-5 w-5" />
                  </button>
                </div>
                
                <div className="space-y-6">
                  {/* High Contrast Mode */}
                  <div className="flex justify-between items-center">
                    <label className="font-medium">High Contrast Mode</label>
                    <button
                      onClick={() => setHighContrast(!highContrast)}
                      className={`relative inline-flex h-6 w-12 items-center rounded-full transition-colors
                        ${highContrast ? 'bg-primary' : 'bg-gray-600'}`}
                    >
                      <span
                        className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform
                          ${highContrast ? 'translate-x-7' : 'translate-x-1'}`}
                      />
                    </button>
                  </div>
                  
                  {/* Font Size */}
                  <div className="space-y-2">
                    <label className="font-medium">Font Size</label>
                    <div className="flex items-center space-x-3">
                      <button
                        onClick={() => setFontSize(Math.max(12, fontSize - 2))}
                        className={`p-2 rounded-md ${highContrast ? 'bg-white text-black' : 'bg-gray-700 text-white'} 
                          ${fontSize <= 12 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-600'}`}
                        disabled={fontSize <= 12}
                      >
                        A-
                      </button>
                      
                      <div className="flex-1 text-center">
                        <span className="inline-block px-3 py-1 rounded bg-gray-800">{fontSize}px</span>
                      </div>
                      
                      <button
                        onClick={() => setFontSize(Math.min(24, fontSize + 2))}
                        className={`p-2 rounded-md ${highContrast ? 'bg-white text-black' : 'bg-gray-700 text-white'} 
                          ${fontSize >= 24 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-600'}`}
                        disabled={fontSize >= 24}
                      >
                        A+
                      </button>
                    </div>
                  </div>
                  
                  {/* Show Accessible Routes Only */}
                  <div className="flex justify-between items-center">
                    <label className="font-medium">Accessible Routes Only</label>
                    <button
                      onClick={() => setAccessibleOnly(!accessibleOnly)}
                      className={`relative inline-flex h-6 w-12 items-center rounded-full transition-colors
                        ${accessibleOnly ? 'bg-primary' : 'bg-gray-600'}`}
                    >
                      <span
                        className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform
                          ${accessibleOnly ? 'translate-x-7' : 'translate-x-1'}`}
                      />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
