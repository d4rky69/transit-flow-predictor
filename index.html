<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitFlow - Public Transit Delay Predictor</title>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet for Maps - Fixed version match -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    
    <!-- Lucide Icons - Fixed implementation -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Map container styling */
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Lower z-index for the map */
        }
        
        /* UI elements styling */
        .ui-container {
            position: relative;
            z-index: 20; /* Higher z-index for UI elements */
        }
        
        /* Accessibility styles */
        .high-contrast {
            --bg-primary: #000000;
            --text-primary: #ffffff;
            --accent-color: #00ffff;
            --panel-bg: rgba(0, 0, 0, 0.9);
        }
        
        /* Custom bus and train markers */
        .bus-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            border: 2px solid white;
        }
        
        .train-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background-color: #ef4444;
            color: white;
            font-weight: bold;
            border: 2px solid white;
        }
        
        .delayed {
            background-color: #f59e0b;
        }
        
        .early {
            background-color: #10b981;
        }
        
        /* Popup styling */
        .leaflet-popup-content-wrapper {
            background-color: rgba(17, 24, 39, 0.95);
            color: white;
            border-radius: 8px;
        }
        
        .leaflet-popup-tip {
            background-color: rgba(17, 24, 39, 0.95);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    
    <script type="text/babel">
        // Main App Component
        const App = () => {
            const [vehicles, setVehicles] = React.useState([]);
            const [map, setMap] = React.useState(null);
            const [markers, setMarkers] = React.useState({});
            const [isPanelOpen, setIsPanelOpen] = React.useState(true);
            const [startLocation, setStartLocation] = React.useState('');
            const [destination, setDestination] = React.useState('');
            const [timeSaving, setTimeSaving] = React.useState(false);
            const [fuelSaving, setFuelSaving] = React.useState(false);
            const [routes, setRoutes] = React.useState([]);
            const [isAccessibilityOpen, setIsAccessibilityOpen] = React.useState(false);
            const [highContrast, setHighContrast] = React.useState(false);
            const [fontSize, setFontSize] = React.useState(16);
            const [showAccessibleRoutesOnly, setShowAccessibleRoutesOnly] = React.useState(false);
            
            const mapRef = React.useRef(null);
            
            // Generate simulated transit data
            const generateVehicles = React.useCallback(() => {
                const routes = [
                    { number: "101", type: "Bus", color: "#3b82f6" },
                    { number: "202", type: "Bus", color: "#3b82f6" },
                    { number: "A", type: "Train", color: "#ef4444" },
                    { number: "B", type: "Train", color: "#ef4444" }
                ];
                
                const statuses = ["On Time", "Delayed", "Early"];
                
                // Generate 10-15 vehicles with random properties
                const vehicleCount = Math.floor(Math.random() * 6) + 10;
                const newVehicles = [];
                
                for (let i = 0; i < vehicleCount; i++) {
                    const route = routes[Math.floor(Math.random() * routes.length)];
                    const status = statuses[Math.floor(Math.random() * statuses.length)];
                    
                    // Generate positions around a central area (can be customized to your fictional city)
                    const centerLat = 40.7128; // Example: NYC
                    const centerLng = -74.006;
                    
                    newVehicles.push({
                        id: `vehicle-${i}`,
                        routeNumber: route.number,
                        type: route.type,
                        currentPosition: {
                            lat: centerLat + (Math.random() - 0.5) * 0.05,
                            lng: centerLng + (Math.random() - 0.5) * 0.05
                        },
                        status: status,
                        delayInMinutes: status === "Delayed" ? Math.floor(Math.random() * 15) + 1 : 0,
                        isWheelchairAccessible: Math.random() > 0.3 // 70% of vehicles are accessible
                    });
                }
                
                return newVehicles;
            }, []);
            
            // Update vehicle positions and statuses
            const updateVehiclePositions = React.useCallback(() => {
                setVehicles(prevVehicles => {
                    return prevVehicles.map(vehicle => {
                        // Small random movement
                        const latChange = (Math.random() - 0.5) * 0.002;
                        const lngChange = (Math.random() - 0.5) * 0.002;
                        
                        // Occasionally change status
                        let newStatus = vehicle.status;
                        let newDelay = vehicle.delayInMinutes;
                        
                        if (Math.random() < 0.1) {
                            const statuses = ["On Time", "Delayed", "Early"];
                            newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                            newDelay = newStatus === "Delayed" ? Math.floor(Math.random() * 15) + 1 : 0;
                        }
                        
                        return {
                            ...vehicle,
                            currentPosition: {
                                lat: vehicle.currentPosition.lat + latChange,
                                lng: vehicle.currentPosition.lng + lngChange
                            },
                            status: newStatus,
                            delayInMinutes: newDelay
                        };
                    });
                });
            }, []);
            
            // Initialize map
            React.useEffect(() => {
                if (!mapRef.current) return;
                
                const newMap = L.map(mapRef.current).setView([40.7128, -74.006], 14);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(newMap);
                
                setMap(newMap);
                
                // Initialize vehicles
                setVehicles(generateVehicles());
                
                return () => {
                    newMap.remove();
                };
            }, [generateVehicles]);
            
            // Set up the interval for updating vehicle positions
            React.useEffect(() => {
                const interval = setInterval(updateVehiclePositions, 5000);
                
                return () => clearInterval(interval);
            }, [updateVehiclePositions]);
            
            // Update map markers when vehicles change
            React.useEffect(() => {
                if (!map) return;
                
                // Clear existing markers
                Object.values(markers).forEach(marker => {
                    marker.remove();
                });
                
                const newMarkers = {};
                
                vehicles.forEach(vehicle => {
                    // Create HTML element for custom marker
                    const markerElement = document.createElement('div');
                    markerElement.className = `${vehicle.type.toLowerCase()}-marker`;
                    
                    if (vehicle.status === "Delayed") {
                        markerElement.classList.add('delayed');
                    } else if (vehicle.status === "Early") {
                        markerElement.classList.add('early');
                    }
                    
                    markerElement.textContent = vehicle.type === "Bus" ? "B" : "T";
                    
                    // Create custom icon
                    const icon = L.divIcon({
                        html: markerElement,
                        className: 'custom-div-icon',
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });
                    
                    // Create marker
                    const marker = L.marker([vehicle.currentPosition.lat, vehicle.currentPosition.lng], {
                        icon: icon
                    }).addTo(map);
                    
                    // Add popup with vehicle details
                    marker.bindPopup(`
                        <div class="p-2">
                            <h3 class="text-lg font-bold">${vehicle.type} ${vehicle.routeNumber}</h3>
                            <p class="text-sm">Status: ${vehicle.status}</p>
                            ${vehicle.status === "Delayed" ? `<p class="text-sm text-yellow-400">Delay: ${vehicle.delayInMinutes} min</p>` : ''}
                            <p class="text-sm">${vehicle.isWheelchairAccessible ? "♿ Wheelchair Accessible" : "Not wheelchair accessible"}</p>
                        </div>
                    `);
                    
                    newMarkers[vehicle.id] = marker;
                });
                
                setMarkers(newMarkers);
            }, [vehicles, map]);
            
            // Handle route search
            const handleSearch = () => {
                if (!startLocation || !destination) return;
                
                // Generate fictional routes based on search criteria
                const baseRoutes = generateRoutes(startLocation, destination);
                
                // Filter for accessibility if needed
                let filteredRoutes = baseRoutes;
                if (showAccessibleRoutesOnly) {
                    filteredRoutes = baseRoutes.filter(route => route.isWheelchairAccessible);
                }
                
                // Sort routes based on preferences
                let sortedRoutes = [...filteredRoutes];
                
                if (timeSaving) {
                    // Sort by arrival time, considering delays
                    sortedRoutes.sort((a, b) => {
                        const aArrival = a.estimatedMinutes + a.delayInMinutes;
                        const bArrival = b.estimatedMinutes + b.delayInMinutes;
                        return aArrival - bArrival;
                    });
                }
                
                if (fuelSaving) {
                    // Prioritize routes with fewer transfers
                    sortedRoutes.sort((a, b) => a.transfers - b.transfers);
                }
                
                setRoutes(sortedRoutes);
            };
            
            // Generate fictional routes based on input
            const generateRoutes = (start, destination) => {
                // Use the first characters of start and destination to seed some variety
                const startChar = start.charCodeAt(0);
                const destChar = destination.charCodeAt(0);
                const routeCount = ((startChar + destChar) % 3) + 2; // 2-4 routes
                
                const routes = [];
                
                for (let i = 0; i < routeCount; i++) {
                    const routeType = Math.random() > 0.5 ? "Bus" : "Train";
                    const routeNumber = routeType === "Bus" ? 
                        `${Math.floor(Math.random() * 900) + 100}` : 
                        String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    
                    const baseMinutes = Math.floor(Math.random() * 30) + 15;
                    const delay = Math.random() > 0.7 ? Math.floor(Math.random() * 15) + 1 : 0;
                    const transfers = Math.floor(Math.random() * 3);
                    
                    routes.push({
                        id: `route-${i}`,
                        routeNumber,
                        type: routeType,
                        estimatedMinutes: baseMinutes,
                        delayInMinutes: delay,
                        status: delay > 0 ? "Delayed" : "On Time",
                        transfers,
                        isWheelchairAccessible: Math.random() > 0.3
                    });
                }
                
                // If time saving is selected, generate an alternative route when primary is delayed
                if (routes.length > 0 && routes[0].delayInMinutes > 5) {
                    routes.push({
                        id: `route-alt`,
                        routeNumber: `Alt ${routes[0].routeNumber}`,
                        type: routes[0].type,
                        estimatedMinutes: routes[0].estimatedMinutes + 2,
                        delayInMinutes: 0,
                        status: "On Time",
                        transfers: routes[0].transfers,
                        isAlternative: true,
                        timeSaved: routes[0].delayInMinutes - 2,
                        isWheelchairAccessible: routes[0].isWheelchairAccessible
                    });
                }
                
                return routes;
            };
            
            // SVG Icon Components
            const ChevronLeftIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            );
            
            const ChevronRightIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            );
            
            const AccessibilityIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="10" r="3"></circle>
                    <path d="M7 21l3-9 3 9M8 18h8"></path>
                </svg>
            );
            
            const XIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            );
            
            return (
                <div className={`min-h-screen ${highContrast ? 'high-contrast' : ''}`} 
                     style={{ fontSize: `${fontSize}px` }}>
                    
                    {/* Map Container (lower z-index) */}
                    <div className="map-container">
                        <div ref={mapRef} style={{ height: '100vh', width: '100vw' }}></div>
                    </div>
                    
                    {/* UI Container (higher z-index) */}
                    <div className="ui-container">
                        {/* Side Panel */}
                        <div className={`fixed top-0 left-0 h-full w-80 bg-gray-900 bg-opacity-90 p-5 transform transition-transform duration-300 ease-in-out shadow-lg ${isPanelOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-bold text-blue-400">TransitFlow</h1>
                                <button 
                                    className="text-white bg-blue-600 hover:bg-blue-700 p-2 rounded-full"
                                    onClick={() => setIsPanelOpen(!isPanelOpen)}
                                >
                                    <ChevronLeftIcon />
                                </button>
                            </div>
                            
                            <div className="mb-6">
                                <div className="mb-4">
                                    <label className="block text-gray-300 text-sm font-medium mb-2">Start Location</label>
                                    <input 
                                        type="text" 
                                        className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                                        placeholder="Enter starting point"
                                        value={startLocation}
                                        onChange={(e) => setStartLocation(e.target.value)}
                                    />
                                </div>
                                
                                <div className="mb-4">
                                    <label className="block text-gray-300 text-sm font-medium mb-2">Destination</label>
                                    <input 
                                        type="text" 
                                        className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                                        placeholder="Enter destination"
                                        value={destination}
                                        onChange={(e) => setDestination(e.target.value)}
                                    />
                                </div>
                                
                                <div className="flex space-x-4 mb-4">
                                    <div className="flex items-center">
                                        <input 
                                            type="checkbox" 
                                            id="time-saving" 
                                            className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-700 rounded"
                                            checked={timeSaving}
                                            onChange={(e) => setTimeSaving(e.target.checked)}
                                        />
                                        <label htmlFor="time-saving" className="ml-2 text-sm text-gray-300">Time Saving</label>
                                    </div>
                                    
                                    <div className="flex items-center">
                                        <input 
                                            type="checkbox" 
                                            id="fuel-saving" 
                                            className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-700 rounded"
                                            checked={fuelSaving}
                                            onChange={(e) => setFuelSaving(e.target.checked)}
                                        />
                                        <label htmlFor="fuel-saving" className="ml-2 text-sm text-gray-300">Fewer Transfers</label>
                                    </div>
                                </div>
                                
                                <button 
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md font-medium transition-colors duration-300"
                                    onClick={handleSearch}
                                >
                                    Find Routes
                                </button>
                            </div>
                            
                            <div className="overflow-y-auto max-h-[calc(100vh-320px)]">
                                <h2 className="text-lg font-semibold text-gray-200 mb-3">Route Options</h2>
                                
                                {routes.length === 0 && (
                                    <div className="text-sm text-gray-400">Search for routes to see options</div>
                                )}
                                
                                {routes.map(route => (
                                    <div 
                                        key={route.id}
                                        className={`mb-3 p-3 rounded-lg ${
                                            route.isAlternative 
                                                ? 'bg-gradient-to-r from-blue-900 to-blue-800 border border-blue-600' 
                                                : 'bg-gray-800'
                                        }`}
                                    >
                                        {route.isAlternative && (
                                            <div className="text-xs font-semibold text-blue-300 mb-1">ALTERNATIVE ROUTE (Saves {route.timeSaved} min)</div>
                                        )}
                                        
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <div className="font-bold text-white">
                                                    {route.type} {route.routeNumber}
                                                </div>
                                                <div className="text-sm text-gray-300">
                                                    Est. time: {route.estimatedMinutes} min
                                                </div>
                                                <div className="text-sm">
                                                    {route.transfers === 0 ? (
                                                        <span className="text-green-400">Direct route</span>
                                                    ) : (
                                                        <span className="text-gray-300">
                                                            {route.transfers} {route.transfers === 1 ? 'transfer' : 'transfers'}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            <div className="text-right">
                                                <div className={`font-medium ${
                                                    route.status === "Delayed" 
                                                        ? 'text-yellow-400' 
                                                        : 'text-green-400'
                                                }`}>
                                                    {route.status}
                                                </div>
                                                {route.delayInMinutes > 0 && (
                                                    <div className="text-yellow-400">
                                                        +{route.delayInMinutes} min delay
                                                    </div>
                                                )}
                                                {route.isWheelchairAccessible && (
                                                    <div className="text-blue-300 text-xl" aria-label="Wheelchair Accessible">
                                                        ♿
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        {/* Toggle Panel Button when closed */}
                        {!isPanelOpen && (
                            <button 
                                className="fixed top-4 left-4 bg-blue-600 hover:bg-blue-700 p-3 rounded-full shadow-lg text-white z-30"
                                onClick={() => setIsPanelOpen(true)}
                            >
                                <ChevronRightIcon />
                            </button>
                        )}
                        
                        {/* Accessibility Button */}
                        <button 
                            className="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 p-3 rounded-full shadow-lg text-white z-30"
                            onClick={() => setIsAccessibilityOpen(true)}
                            aria-label="Accessibility Options"
                        >
                            <AccessibilityIcon />
                        </button>
                        
                        {/* Accessibility Modal */}
                        {isAccessibilityOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-gray-800 rounded-lg p-6 max-w-md w-full">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-white">Accessibility Options</h2>
                                        <button 
                                            className="text-gray-400 hover:text-white"
                                            onClick={() => setIsAccessibilityOpen(false)}
                                        >
                                            <XIcon />
                                        </button>
                                    </div>
                                    
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <label className="text-gray-300">High Contrast Mode</label>
                                            <div 
                                                className={`w-12 h-6 rounded-full p-1 cursor-pointer ${highContrast ? 'bg-blue-600' : 'bg-gray-600'}`}
                                                onClick={() => setHighContrast(!highContrast)}
                                            >
                                                <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${highContrast ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label className="text-gray-300">Font Size</label>
                                            <div className="flex items-center mt-2">
                                                <button 
                                                    className="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded-l"
                                                    onClick={() => setFontSize(Math.max(12, fontSize - 2))}
                                                >
                                                    A-
                                                </button>
                                                <div className="bg-gray-600 text-white px-4 py-1">{fontSize}px</div>
                                                <button 
                                                    className="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded-r"
                                                    onClick={() => setFontSize(Math.min(24, fontSize + 2))}
                                                >
                                                    A+
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex items-center justify-between">
                                            <label className="text-gray-300">Show Accessible Routes Only</label>
                                            <div 
                                                className={`w-12 h-6 rounded-full p-1 cursor-pointer ${showAccessibleRoutesOnly ? 'bg-blue-600' : 'bg-gray-600'}`}
                                                onClick={() => setShowAccessibleRoutesOnly(!showAccessibleRoutesOnly)}
                                            >
                                                <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${showAccessibleRoutesOnly ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-6">
                                        <button 
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md font-medium"
                                            onClick={() => setIsAccessibilityOpen(false)}
                                        >
                                            Apply Settings
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
